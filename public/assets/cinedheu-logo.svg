<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="54" cy="42" r="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B0A1B" />
      <stop offset="0.48" stop-color="#141620" />
      <stop offset="1" stop-color="#07080C" />
    </radialGradient>
    <radialGradient id="ambientAura" cx="54" cy="54" r="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF1E4D" stop-opacity="0.28" />
      <stop offset="0.65" stop-color="#E50936" stop-opacity="0.08" />
      <stop offset="1" stop-color="#E50936" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rimGrad" x1="10" y1="8" x2="98" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="0.5" stop-color="#FF335E" stop-opacity="0.16" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="arcGrad" x1="26" y1="40" x2="77" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5C82" />
      <stop offset="0.6" stop-color="#E50936" />
      <stop offset="1" stop-color="#E50936" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="26" y1="36" x2="82" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF4772" />
      <stop offset="0.45" stop-color="#E50936" />
      <stop offset="1" stop-color="#8F031E" />
    </linearGradient>
    <linearGradient id="crestGrad" x1="30" y1="50" x2="78" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.7" stop-color="#FFE6EC" />
      <stop offset="1" stop-color="#FFBAC9" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.4" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Deep studio obsidian-crimson squircle -->
  <rect width="108" height="108" rx="26" fill="url(#bgGrad)" />
  <rect x="0.8" y="0.8" width="106.4" height="106.4" rx="25.2" stroke="url(#rimGrad)" stroke-width="1.4" />

  <!-- Subtle inner crimson glow -->
  <circle cx="54" cy="54" r="36" fill="url(#ambientAura)" />

  <!-- Glass aperture ring + luminous upper-left arc -->
  <circle cx="54" cy="54" r="31.5" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5" />
  <path d="M25.5,40.5 A31.5,31.5 0 0,1 76.5,30.5" stroke="url(#arcGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Primary CineDheu Crimson Wave ("Dheu") -->
  <g filter="url(#softGlow)">
    <path d="M26.5,63.5 C34.5,39.5 46.5,35.5 56,49.5 C63.5,61 72.5,55.5 81.5,36.5 C79.5,64.5 65.5,79 49,69.5 C40.5,64.5 33.5,67.5 26.5,63.5 Z" fill="url(#waveGrad)" />

    <!-- Crisp white-silver wave crest -->
    <path d="M30.5,49 C38.5,32.5 51,32.5 59,44.5 C65,53 72.5,49 77.5,34.5" stroke="url(#crestGrad)" stroke-width="3.2" stroke-linecap="round" />

    <!-- Cinema play prism -->
    <path d="M48.5,46.8 L61.5,54.3 L48.5,61.8 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round" />
  </g>
</svg>
